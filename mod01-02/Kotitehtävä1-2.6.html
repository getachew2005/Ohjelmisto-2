<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Neliöjuuren laskeminen</title>
</head>
<body>

<script>
    let vastaus = confirm("Lasketaanko neliöjuuri?");

    if (vastaus == true) {
        let luku = Number(prompt("Anna luku:"));

        if (luku < 0) {
            document.write("Negatiivisen numeron neliöjuurta ei ole määritelty.");
        } else {
            let neliojuuri = Math.sqrt(luku);
            document.write("Numeron neliöjuuri on " + neliojuuri);
        }

    } else {
        document.write("Neliöjuurta ei yhtään lasketa.");
    }
</script>

</body>
</html>
