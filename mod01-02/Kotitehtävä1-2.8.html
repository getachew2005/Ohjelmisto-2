<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Karkausvuodet</title>
</head>
<body>

<script>
    let alkuvuosi = Number(prompt("Anna ensimmäinen vuosi:"));
    let loppuvuosi = Number(prompt("Anna viimeinen vuosi:"));

    document.write("<ul>");

    for (let vuosi = alkuvuosi; vuosi <= loppuvuosi; vuosi++) {

        if (vuosi % 400 == 0 || (vuosi % 4 == 0 && vuosi % 100 != 0)) {
            document.write("<li>" + vuosi + "</li>");
        }

    }

    document.write("</ul>");

</script>

</body>
</html>
