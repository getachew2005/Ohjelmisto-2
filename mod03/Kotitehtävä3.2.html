<!DOCTYPE html>
<html>
<head>
    <title>Osallistujat</title>
</head>
<body>

    <h2>Osallistujat aakkosjärjestyksessä</h2>

    <ol id="lista"></ol>

    <script>
        let osallistujat = [];

        let maara = Number(prompt("Kuinka monta osallistujaa on?"));

        for (let i = 0; i < maara; i++) {
            let nimi = prompt("Anna osallistujan nimi:");
            osallistujat.push(nimi);
        }

        osallistujat.sort();

        let lista = document.getElementById("lista");

        for (let i = 0; i < osallistujat.length; i++) {
            let kohta = document.createElement("li");
            kohta.textContent = osallistujat[i];
            lista.appendChild(kohta);
        }
    </script>

</body>
</html>
